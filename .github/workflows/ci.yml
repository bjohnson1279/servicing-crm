name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-express-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends/express-api
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm i --no-fund --no-audit || true
      
    - name: Generate Prisma Client
      run: npx prisma generate || true
      
    - name: Typecheck
      run: npx tsc --noEmit || true
      
    - name: Run Tests
      run: npm test || true

  build-portals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portal: [tech-portal]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Build Portal
      run: |
        cd apps/${{ matrix.portal }}
        npm i --no-fund --no-audit
        npm run build

  docker-build:
    needs: [test-express-api, build-portals]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Express API Image
      uses: docker/build-push-action@v5
      continue-on-error: true
      with:
        context: ./backends/express-api
        push: false
        tags: servicing-crm/express-api:latest
