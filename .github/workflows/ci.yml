name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-express-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4

    - name: Check for Merge Conflict Markers
      run: |
        echo "Scanning codebase for git merge conflict markers..."
        if git grep -n -I -E '^(<{7}|={7}|>{7}|\|{7})([[:space:]]|$)'; then
          echo "::error::Merge conflict markers detected in tracked files! Please resolve conflicts before merging."
          exit 1
        fi
        echo "No conflict markers detected."
    
    - name: Check Express API Availability
      id: check_express
      run: |
        if [ -f "backends/express-api/package.json" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "backends/express-api is not checked out in this runner. Skipping."
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: Use Node.js 20
      if: steps.check_express.outputs.available == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backends/express-api/package-lock.json'
        
    - name: Install dependencies
      if: steps.check_express.outputs.available == 'true'
      working-directory: backends/express-api
      run: npm ci
      
    - name: Generate Prisma Client
      if: steps.check_express.outputs.available == 'true'
      working-directory: backends/express-api
      run: npx prisma generate
      
    - name: Typecheck
      if: steps.check_express.outputs.available == 'true'
      working-directory: backends/express-api
      run: npx tsc --noEmit
      
    - name: Run Tests
      if: steps.check_express.outputs.available == 'true'
      working-directory: backends/express-api
      run: npm test

  build-portals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [admin-portal, customer-portal, tech-portal]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Portal Availability
      id: check_portal
      run: |
        if [ -f "apps/${{ matrix.portal }}/package.json" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "Portal apps/${{ matrix.portal }} is not checked out in this runner. Skipping."
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: Use Node.js 20
      if: steps.check_portal.outputs.available == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Build Portal
      if: steps.check_portal.outputs.available == 'true'
      run: |
        cd apps/${{ matrix.portal }}
        npm ci
        npm run build

  docker-build:
    needs: [test-express-api, build-portals]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Dockerfile Availability
      id: check_docker
      run: |
        if [ -f "backends/express-api/Dockerfile" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "Dockerfile not present in runner. Skipping."
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      if: steps.check_docker.outputs.available == 'true'
      uses: docker/setup-buildx-action@v3
      
    - name: Build Express API Image
      if: steps.check_docker.outputs.available == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./backends/express-api
        push: false
        tags: servicing-crm/express-api:latest
