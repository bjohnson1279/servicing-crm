name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-express-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backends/express-api
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Check for Merge Conflict Markers
      run: |
        echo "Scanning codebase for git merge conflict markers..."
        if git grep -n -I -E '^(<{7}|={7}|>{7}|\|{7})([[:space:]]|$)'; then
          echo "::error::Merge conflict markers detected in tracked files! Please resolve conflicts before merging."
          exit 1
        fi
        echo "No conflict markers detected."
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backends/express-api/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Typecheck
      run: npx tsc --noEmit
      
    - name: Run Tests
      run: npm test

  build-portals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        portal: [admin-portal, customer-portal, tech-portal]
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Build Portal
      run: |
        cd apps/${{ matrix.portal }}
        npm ci
        npm run build

  docker-build:
    needs: [test-express-api, build-portals]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Express API Image
      uses: docker/build-push-action@v5
      with:
        context: ./backends/express-api
        push: false
        tags: servicing-crm/express-api:latest
