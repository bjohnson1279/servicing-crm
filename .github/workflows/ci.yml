name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for merge conflict markers
        run: |
          if git grep -n -I -E '^(<{7}|={7}|>{7}|\|{7})([[:space:]]|$)'; then
            echo "::error::Resolve merge conflict markers before merging."
            exit 1
          fi
      - name: Require application source
        run: |
          for component in apps/tech-portal; do
            manifest=package.json
            if [ ! -s "$component/$manifest" ]; then
              echo "::error::Required source is missing: $component/$manifest. Tests cannot be skipped."
              exit 1
            fi
          done

  ci-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ci-gate.test.mjs

  build-portals:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [tech-portal]
    defaults:
      run:
        working-directory: apps/${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run required portal tests
        run: npm test
      - run: npm run build

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [verify-source, ci-policy, build-portals]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require every validation job to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
