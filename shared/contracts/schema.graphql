scalar DateTime
scalar Date
scalar UUID

enum Role { 
  SUPER_ADMIN 
  DISPATCHER 
  TECHNICIAN 
  CUSTOMER 
  DOOR_TO_DOOR_SALES 
  CUSTOMER_SERVICE_REP 
  MANAGER 
}
enum TechnicianStatus { AVAILABLE EN_ROUTE ON_SITE OFF_DUTY }
enum JobStatus { DRAFT SCHEDULED IN_PROGRESS COMPLETED INVOICED CANCELLED }
enum LeadStatus { NOT_HOME NOT_INTERESTED PITCHED SOLD }
enum ContractCadence { ONE_TIME MONTHLY BI_MONTHLY QUARTERLY SEMI_ANNUALLY ANNUALLY }
enum ContactChannel { PHONE EMAIL SMS IN_PERSON }
enum ContactDirection { INBOUND OUTBOUND }

type Tenant { id: UUID! name: String! businessHours: String createdAt: DateTime! }
type User { id: UUID! tenantId: UUID! email: String! role: Role! }
type Customer { id: UUID! userId: UUID! name: String! }
type Property { id: UUID! customerId: UUID! address: String! }
type Technician { id: UUID! userId: UUID! status: TechnicianStatus! }

type ServiceContract {
  id: UUID!
  customerId: UUID!
  propertyId: UUID!
  cadence: ContractCadence!
  startDate: Date!
  endDate: Date
  autoRenew: Boolean
  recurringAmount: Float
}

type Job {
  id: UUID!
  tenantId: UUID!
  customerId: UUID!
  propertyId: UUID!
  technicianId: UUID
  contractId: UUID
  status: JobStatus!
  scheduledStart: DateTime
  scheduledEnd: DateTime
  customer: Customer
  property: Property
  technician: Technician
  contract: ServiceContract
}

type CanvassPin {
  id: UUID!
  salesRepId: UUID!
  lat: Float!
  lng: Float!
  status: LeadStatus!
}

type Commission {
  id: UUID!
  salesRepId: UUID!
  jobId: UUID
  amount: Float!
  isClawedBack: Boolean
}

type ContactLog {
  id: UUID!
  customerId: UUID!
  channel: ContactChannel!
  direction: ContactDirection!
  summary: String
}

type Query {
  jobs(status: JobStatus): [Job!]!
  serviceContracts(customerId: UUID): [ServiceContract!]!
  commissions(salesRepId: UUID): [Commission!]!
}

type Mutation {
  createJob(tenantId: UUID!, customerId: UUID!, propertyId: UUID!, scheduledStart: DateTime): Job!
  updateJobStatus(id: UUID!, status: JobStatus!): Job!
  createCanvassPin(salesRepId: UUID!, lat: Float!, lng: Float!, status: LeadStatus!): CanvassPin!
  logContact(customerId: UUID!, channel: ContactChannel!, direction: ContactDirection!, summary: String): ContactLog!
}
